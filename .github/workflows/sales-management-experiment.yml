name: sales-management-experiment
on:
  workflow_dispatch:
  push:
    paths:
      - 'run_experiment.py'
      - 'requirements.txt'
jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python run_experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: shigaku-sales-management-results
          path: results/
